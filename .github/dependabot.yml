version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: "UTC"
    assignees:
      - ChristophShyper
    groups:
      eslint-and-typescript:
        patterns:
          - 'eslint'
          - '@eslint/*'
          - 'eslint-*'
          - 'typescript'
          - 'typescript-*'
          - 'typescript-eslint*'
          - '@types/*'
          - 'globals'
      astro-and-preact:
        patterns:
          - 'astro'
          - '@astrojs/*'
          - 'preact'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: UTC
    assignees:
      - ChristophShyper
